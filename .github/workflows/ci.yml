name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every action is pinned to a commit SHA, with its tag in a comment; Dependabot bumps both.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck
        run: shellcheck install.sh scripts/*.sh templates/common/.claude/hooks/*.sh templates/common/.devcontainer/*.sh templates/privacy/scripts/*.sh

      - name: Validate plugin and marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: Validate YAML and JSON
        run: |
          python3 - <<'PY'
          import json, pathlib, yaml
          files = [p for p in pathlib.Path(".").rglob("*") if p.is_file() and ".git" not in p.parts]
          for p in files:
              if p.suffix in (".yml", ".yaml"):
                  yaml.safe_load(p.read_text())
              elif p.suffix == ".json" and "{{" not in p.read_text():
                  json.loads(p.read_text())
          print("ok")
          PY

      - name: install.sh dry run
        run: ./install.sh --dry-run --with-omniroute --windows-too

  python-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Instantiate and test the Python template
        run: |
          T="$RUNNER_TEMP/demo"
          scripts/apply-template.sh --target "$T" --stack common --stack python \
            --var PROJECT_NAME=demo --var DESCRIPTION=Demo --var OWNER=demo \
            --var AUTHOR=Demo --var YEAR=2026
          cd "$T"
          echo "# demo" > README.md
          uv lock && uv sync
          uv run python -m app.schema
          uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest
      - name: Dependency audit (same command as the template CI)
        run: |
          cd "$RUNNER_TEMP/demo"
          uv export --frozen --format requirements-txt --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off
      - name: Claude Code hooks
        run: scripts/check-hooks.sh "$RUNNER_TEMP/demo"

  rust-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Instantiate and test the Rust template
        env:
          RUSTFLAGS: -D warnings
        run: |
          T="$RUNNER_TEMP/demo"
          scripts/apply-template.sh --target "$T" --stack common --stack rust \
            --var PROJECT_NAME=demo-cli --var CRATE_NAME=demo_cli --var DESCRIPTION=Demo \
            --var OWNER=demo --var AUTHOR=Demo --var YEAR=2026
          cd "$T"
          echo "# demo" > README.md
          cargo fmt --all --check
          cargo clippy --all-targets --all-features
          cargo test

  # The one check branch protection requires: green only if every job above is.
  ci-pass:
    name: ci-pass
    if: always()
    needs: [check, python-template, rust-template]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
