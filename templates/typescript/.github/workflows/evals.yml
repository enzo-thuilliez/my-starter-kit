name: Evals

# Manual on purpose: evals call real models and cost money.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promptfoo:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx -y promptfoo@latest eval -c evals/promptfooconfig.yaml --no-progress-bar
