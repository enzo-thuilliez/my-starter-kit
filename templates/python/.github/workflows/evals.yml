name: Evals

# Manual on purpose: evals call real models and cost money.
on:
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a commit SHA, with its tag in a comment; Dependabot bumps both.

jobs:
  promptfoo:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: uv sync --frozen
      - run: uv run npx -y promptfoo@latest eval -c evals/promptfooconfig.yaml --no-progress-bar
