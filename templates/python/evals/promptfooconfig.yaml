# Run with: uv run promptfoo eval -c evals/promptfooconfig.yaml   (needs API keys in .env)
# Paths are relative to this file.
# Every version of every prompt in src/app/prompts is evaluated side by side, so a new
# version (v2.md) is compared with the current one before the app switches to it.
description: "{{PROJECT_NAME}} evals"

prompts:
  - file://../src/app/prompts/ask/v*.md

providers:
  - id: file://provider.py
    label: default-model

tests:
  - vars:
      question: What is the capital of France?
    assert:
      - type: icontains
        value: Paris
  # Number guardrail: the answer may only restate numbers given in the input.
  - vars:
      question: >-
        Revenue was 1,234,000 EUR in 2025 and the operating margin was 12.5%.
        Summarise the year in one sentence.
    assert:
      - type: python
        value: file://assert_numbers.py
