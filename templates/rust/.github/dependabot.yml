version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: ["type:deps"]
    commit-message:
      prefix: chore
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["type:deps", "area:ci"]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
